The error is from the old script still being used. Let’s completely replace it with a super‑simple version and test it.

## 1. Stop existing wallpaper processes

```bash
pkill hyprpaper
pkill wallpaper-slideshow.sh 2>/dev/null
```

## 2. Rewrite the script from zero

```bash
nano ~/.config/hypr/scripts/wallpaper-slideshow.sh
```

Delete everything in that file, then paste **exactly** this:

```bash
#!/bin/bash

DIR="$HOME/Pictures/wallpapers"
MONITOR="$(hyprctl monitors -j | jq -r '.[0].name')"

while true; do
    WALLPAPER=$(find "$DIR" -maxdepth 1 -type f -iname '*.jpg' | shuf -n 1)

    [ -z "$WALLPAPER" ] && sleep 60 && continue

    hyprctl hyprpaper preload "$WALLPAPER"
    hyprctl hyprpaper wallpaper "$MONITOR,$WALLPAPER"

    sleep 600
done
```

Notes:
- This version only looks for `.jpg` files (simpler while testing).  
- No `$$ ... -o ... $$` group, so no more “unexpected token (” error.

Save (Ctrl+X, Y, Enter) and make it executable:

```bash
chmod +x ~/.config/hypr/scripts/wallpaper-slideshow.sh
```

## 3. Start Hyprpaper + script manually to test

```bash
hyprpaper &
~/.config/hypr/scripts/wallpaper-slideshow.sh &
```

If everything is correct, within a few seconds the wallpaper should change to one of the `.jpg` images in `~/Pictures/wallpapers`.

If it still errors, copy the **exact** one‑line error text that appears under the command you ran.

