* {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    min-height: 35px;
}

window#waybar {
    background-color: rgba(30, 30, 46, 0.9);
    color: #cdd6f4;
    border-bottom: 2px solid #89dceb;
}

#workspaces button {
    padding: 0 10px;
    color: #6c7086;
    border-radius: 10px;
    margin: 0 3px;
}

#workspaces button.active {
    background-color: #89dceb;
    color: #1e1e2e;
    border-radius: 10px;
}

#workspaces button:hover {
    background-color: #313244;
    border-radius: 10px;
}

#clock, #network, #cpu, #memory, #battery, #pulseaudio {
    padding: 0 10px;
    margin: 0 5px;
    border-radius: 8px;
    background-color: #313244;
}

#clock {
    background-color: #45475a;
}

#battery.good {
    color: #a6e3a1;
}

#battery.warning {
    color: #f9e2af;
}

#battery.critical {
    color: #f38ba8;
}

#pulseaudio:hover {
    background-color: #45475a;
}