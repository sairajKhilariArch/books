window {
    margin: 0px;
    border: 2px solid #89dceb;
    background-color: #1e1e2e;
    border-radius: 15px;
}

#input {
    margin: 15px;
    border: 2px solid #89dceb;
    color: #cdd6f4;
    background-color: #313244;
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
}

#outer-box {
    margin: 0px;
    padding: 15px;
}

#scroll {
    margin: 0px;
}

#inner-box {
    margin: 0px;
}

#entry {
    padding: 10px;
    margin: 5px 0px;
    border-radius: 10px;
    background-color: #313244;
    color: #cdd6f4;
}

#entry:selected {
    background-color: #89dceb;
    color: #1e1e2e;
}