general {
    gaps_in = 8
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(89dcebff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 15
    blur = yes
    blur_size = 5
    blur_passes = 2
    blur_new_optimizations = on
    
    drop_shadow = yes
    shadow_range = 20
    shadow_offset = 0 3
    shadow_render_power = 3
    col.shadow = rgba(1e1e2ecc)
}

animations {
    enabled = yes
    animation = windows, 1, 7, default
    animation = windowsMove, 1, 7, default
    animation = windowsIn, 1, 7, default
    animation = windowsOut, 1, 7, default
    animation = fade, 1, 10, default
    animation = workspaces, 1, 6, default
    animation = border, 1, 10, default
}








{
    "layer": "top",
    "position": "top",
    "height": 35,
    "modules-left": ["hyprland/workspaces", "hyprland/submap"],
    "modules-center": ["clock"],
    "modules-right": ["network", "cpu", "memory", "battery", "pulseaudio", "tray"],
    
    "hyprland/workspaces": {
        "format": "{icon}",
        "on-click": "activate",
        "persistent_workspaces": {
            "1": [],
            "2": [],
            "3": [],
            "4": [],
            "5": []
        }
    },
    
    "clock": {
        "format": "{:%A, %B %d, %H:%M}",
        "tooltip-format": "<tt><small>{calendar}</small></tt>"
    },
    
    "network": {
        "format": "󰀂 {essid}",
        "format-disconnected": "󰌙 Disconnected"
    },
    
    "cpu": {
        "format": " {usage}%"
    },
    
    "memory": {
        "format": " {used:.0f}M"
    },
    
    "battery": {
        "states": {
            "good": 80,
            "warning": 30,
            "critical": 15
        },
        "format": "{icon} {capacity}%",
        "format-icons": ["", "", "", "", ""]
    },
    
    "pulseaudio": {
        "format": "{icon} {volume}%",
        "format-muted": "󰝟",
        "format-icons": {
            "headphone": "",
            "hands-free": "",
            "headset": "",
            "phone": "",
            "portable": "",
            "car": "",
            "default": ["", "", ""]
        },
        "on-click": "pavucontrol"
    },
    
    "tray": {
        "icon-size": 21,
        "spacing": 10
    }
}