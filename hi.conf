animations {
    enabled = yes, please :)

    # Define the sharp, quick curve for a cyberpunk look
    bezier = cyberpunk, 0.5, 0.05, 0.8, 0.9 
    
    # You can keep the default curves too if you want:
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostlinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    # Default animations
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    
    # --- CYBERPUNK WINDOWS ---
    # Windows pop in aggressively from 80% size
    animation = windows, 1, 4, cyberpunk, popin 80%
    # Windows fade out very quickly
    animation = windowsIn, 1, 4.1, cyberpunk, popin 87%
    animation = windowsOut, 1, 3, linear, fade

    # --- CYBERPUNK WORKSPACES ---
    # Workspaces switch quickly with a slide/fade, using the sharp curve
    animation = workspaces, 1, 3, cyberpunk, slidefade
    animation = workspacesIn, 1, 3, cyberpunk, slidefade
    animation = workspacesOut, 1, 3, cyberpunk, slidefade

    # --- FADES (Keep quick and simple) ---
    animation = fade, 1, 3, quick
    animation = fadeIn, 1, 1.73, almostlinear
    animation = fadeOut, 1, 1.46, almostlinear

    # --- LAYERS (e.g., Waybar, Rofi menus) ---
    # Layers pop in quickly from the top (change 'slide top' to your preference)
    animation = layers, 1, 5, cyberpunk, slide top
    animation = layersIn, 1, 5, cyberpunk, slide top
    animation = layersOut, 1, 5, cyberpunk, slide bottom
    
    # Other animations
    animation = zoomFactor, 1, 7, quick
}
