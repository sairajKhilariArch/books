* {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
}

window#waybar {
  background: rgba(0, 0, 0, 0.7);
  color: #ffffff;
}

#workspaces button {
  padding: 0 8px;
  margin: 0 4px;
  border-radius: 10px;
  background: transparent;
  color: #aaaaaa;
}

#workspaces button.active {
  background: #00bcd4;
  color: #000000;
}

#window, #clock, #network, #pulseaudio, #battery, #cpu, #memory, #custom-power {
  padding: 0 8px;
  margin: 0 4px;
  border-radius: 8px;
  background: rgba(20, 20, 20, 0.7);
}