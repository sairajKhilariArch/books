animations {
    enabled = yes

    # --- BEZIER CURVES ---
    # The primary curve for smooth, elegant movement (slows down softly at the end)
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    # A general-purpose smooth curve
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    # Standard linear and quick curves
    bezier = linear, 0, 0, 1, 1
    bezier = almostlinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    
    # --- WINDOWS (Graceful Entry/Exit) ---
    # Windows smoothly fade in and scale up from a slightly smaller size
    animation = windows, 1, 6, easeOutQuint, popin 8%
    animation = windowsIn, 1, 6, easeOutQuint, popin 8%
    
    # Windows smoothly fade out when closing
    animation = windowsOut, 1, 5, easeOutQuint, fade
    
    # --- WORKSPACES (Gentle Slide) ---
    # Workspaces slide in and out gently using the smooth curve
    animation = workspaces, 1, 7, easeOutQuint, slide

    # --- LAYERS (Menus & Bars) ---
    # Layers like Waybar or Rofi smoothly slide/fade in from the top/bottom
    animation = layers, 1, 5, easeOutQuint, slide top
    animation = layersIn, 1, 5, easeOutQuint, slide top
    animation = layersOut, 1, 5, easeOutQuint, slide bottom
    
    # --- FADES (Subtle Effect) ---
    animation = fade, 1, 5, easeOutQuint
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint

    # --- DEFAULTS ---
    animation = global, 1, 5, easeOutQuint
    animation = border, 1, 5, easeOutQuint
    animation = zoomFactor, 1, 6, easeOutQuint
}
