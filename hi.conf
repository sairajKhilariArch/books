animations {
    enabled = yes
    
    # Keep the aggressive curve
    bezier = cyberpunk, 0.5, 0.05, 0.8, 0.9 
    
    # --- CYBERPUNK WINDOWS (Faster and Sharper) ---
    # Windows appear instantly (speed 15) with a strong pop
    animation = windows, 1, 15, cyberpunk, popin 80%
    animation = windowsIn, 1, 15, cyberpunk, popin 87%
    
    # Windows close by fading out very quickly
    animation = windowsOut, 1, 5, linear, fade

    # --- CYBERPUNK WORKSPACES (Maximum Speed) ---
    # Change to the correct 'slide' style, but increase the speed to 10
    animation = workspaces, 1, 10, cyberpunk, slide
    animation = workspacesIn, 1, 10, cyberpunk, slide
    animation = workspacesOut, 1, 10, cyberpunk, slide

    # --- FADES (Fast and Crisp) ---
    animation = fade, 1, 5, quick
    animation = fadeIn, 1, 5, almostlinear
    animation = fadeOut, 1, 5, almostlinear

    # --- LAYERS (Menus/Bars Pop In) ---
    # Layers (like Waybar) appear very quickly from the top
    animation = layers, 1, 8, cyberpunk, slide top
    animation = layersIn, 1, 8, cyberpunk, slide top
    
    # Layers disappear very quickly to the bottom
    animation = layersOut, 1, 8, cyberpunk, slide bottom
    
    # Default/Other animations (kept high speed for consistency)
    animation = global, 1, 15, default
    animation = border, 1, 15, easeOutQuint
    animation = zoomFactor, 1, 10, quick

    # Optional: Increase the speed of the other default curves for consistency
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostlinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
}
