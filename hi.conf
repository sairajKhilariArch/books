{
  "layer": "top",
  "position": "top",
  "height": 30,

  "modules-left": ["hyprland/workspaces", "window"],
  "modules-center": ["clock"],
  "modules-right": ["network", "pulseaudio", "battery", "cpu", "memory", "custom/power"],

  "hyprland/workspaces": {
    "format": "{icon}",
    "on-click": "activate",
    "persistent_workspaces": { "1": [], "2": [], "3": [], "4": [], "5": [] }
  },

  "window": {
    "format": "{title}",
    "max-length": 60
  },

  "clock": {
    "format": "{:%a %d %b  %H:%M}"
  },

  "network": {
    "format-wifi": "  {essid}",
    "format-ethernet": "  {ipaddr}",
    "format-disconnected": "󰌙  offline"
  },

  "pulseaudio": {
    "format": "{icon} {volume}%",
    "format-muted": "󰝟  muted",
    "format-icons": { "default": ["󰕿","󰖀","󰕾"] },
    "on-click": "pavucontrol",
    "on-scroll-up": "pamixer -i 5",
    "on-scroll-down": "pamixer -d 5",
    "on-click-right": "pamixer -t"
  },

  "battery": {
    "format": "{icon} {capacity}%",
    "format-charging": "󰂄 {capacity}%",
    "format-icons": ["󰁺","󰁻","󰁼","󰁽","󰁾","󰁿","󰂀","󰂁","󰂂","󰁹"]
  },

  "cpu": { "format": " {usage}%" },

  "memory": { "format": "󰍛 {used}GiB" },

  "custom/power": {
    "format": "",
    "tooltip": "Power menu",
    "on-click": "wofi --show dmenu | xargs systemctl"
  }
}