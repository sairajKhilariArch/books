mkdir -p ~/.local/bin
nano ~/.local/bin/hypr-power-menu



#!/bin/sh
choice=$(printf "Shutdown
Reboot
Suspend
Logout" | wofi --show dmenu --prompt "Power")
case "$choice" in
  Shutdown) systemctl poweroff ;;
  Reboot)   systemctl reboot ;;
  Suspend)  systemctl suspend ;;
  Logout)   hyprctl dispatch exit ;;
esac






chmod +x ~/.local/bin/hypr-power-menu






  "custom/power": {
    "format": "",
    "tooltip": "Power menu",
    "on-click": "~/.local/bin/hypr-power-menu"
  }











pkill waybar
waybar &